apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: astrbot-community-plugin-registry
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: astrbot-registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: astrbot-community-plugin-registry
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: astrbot-community-plugin-registry
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: astrbot-registry
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: astrbot-community-plugin-registry
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astrbot-community-plugin-registry
        app.kubernetes.io/component: dashboard
        app.kubernetes.io/part-of: astrbot-registry
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/rc-chn/astrbot-community-plugin-registry-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
