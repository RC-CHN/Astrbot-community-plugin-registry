apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: astrbot-community-plugin-registry
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: astrbot-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: astrbot-community-plugin-registry
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astrbot-community-plugin-registry
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: astrbot-registry
    spec:
      initContainers:
        - name: wait-for-backend
          image: ghcr.io/rc-chn/astrbot-community-plugin-registry-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: astrbot-registry-config
          command:
            - python
            - -c
            - |
              import os
              import time
              import urllib.request

              deadline = time.time() + 180
              while time.time() < deadline:
                  try:
                      req = urllib.request.Request(
                          "http://backend:8000/api/v1/health",
                          headers={"Host": os.environ["HEALTHCHECK_HOST"]},
                      )
                      if urllib.request.urlopen(req, timeout=3).status == 200:
                          raise SystemExit(0)
                  except Exception:
                      pass
                  time.sleep(2)
              raise SystemExit("backend is not ready")
      containers:
        - name: worker
          image: ghcr.io/rc-chn/astrbot-community-plugin-registry-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: astrbot-registry-config
            - secretRef:
                name: astrbot-registry-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
