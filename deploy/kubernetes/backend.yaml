apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: astrbot-community-plugin-registry
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: astrbot-registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: astrbot-community-plugin-registry
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: astrbot-community-plugin-registry
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: astrbot-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: astrbot-community-plugin-registry
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astrbot-community-plugin-registry
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: astrbot-registry
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: ghcr.io/rc-chn/astrbot-community-plugin-registry-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import socket
              import time
              import urllib.request

              deadline = time.time() + 180
              while time.time() < deadline:
                  ok = True
                  for host, port in (("postgres", 5432), ("redis", 6379)):
                      try:
                          with socket.create_connection((host, port), timeout=2):
                              pass
                      except OSError:
                          ok = False
                  try:
                      urllib.request.urlopen("http://seaweedfs:9333/", timeout=2).read()
                  except Exception:
                      ok = False
                  if ok:
                      raise SystemExit(0)
                  time.sleep(2)
              raise SystemExit("dependencies are not ready")
      containers:
        - name: backend
          image: ghcr.io/rc-chn/astrbot-community-plugin-registry-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: astrbot-registry-config
            - secretRef:
                name: astrbot-registry-secrets
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  import sys
                  import urllib.request
                  req = urllib.request.Request(
                      "http://127.0.0.1:8000/api/v1/health",
                      headers={"Host": os.environ["HEALTHCHECK_HOST"]},
                  )
                  sys.exit(0 if urllib.request.urlopen(req, timeout=3).status == 200 else 1)
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  import sys
                  import urllib.request
                  req = urllib.request.Request(
                      "http://127.0.0.1:8000/api/v1/health",
                      headers={"Host": os.environ["HEALTHCHECK_HOST"]},
                  )
                  sys.exit(0 if urllib.request.urlopen(req, timeout=3).status == 200 else 1)
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
