apiVersion: v1
kind: ConfigMap
metadata:
  name: astrbot-registry-config
  labels:
    app.kubernetes.io/name: astrbot-community-plugin-registry
    app.kubernetes.io/part-of: astrbot-registry
data:
  DEPLOYMENT_MODE: production
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  APP_RELOAD: "false"
  LOG_LEVEL: info
  DOCS_ENABLED: "false"
  TRUSTED_HOSTS: registry.example.com
  CORS_ALLOW_ORIGINS: ""
  SECURITY_HEADERS_ENABLED: "true"
  HSTS_ENABLED: "false"
  HSTS_MAX_AGE_SECONDS: "31536000"
  BOOTSTRAP_API_ENABLED: "false"
  HEALTHCHECK_HOST: registry.example.com
  PUBLIC_CACHE_MAX_AGE: "60"

  PG_DATABASE: astrbot_registry
  PG_USER: astrbot
  DATABASE_AUTO_MIGRATE: "true"

  REDIS_URL: redis://redis:6379
  REDIS_APPENDONLY: "yes"
  REDIS_MAXMEMORY: 256mb
  REDIS_MAXMEMORY_POLICY: allkeys-lru
  REDIS_CACHE_TTL: "3600"
  REDIS_TASK_QUEUE_KEY: registry_tasks
  REDIS_TASK_DEAD_LETTER_QUEUE_KEY: registry_tasks_dead
  TASK_MAX_ATTEMPTS: "3"
  TASK_RETRY_DELAY_SECONDS: "5"

  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: astrbot-plugins
  S3_PUBLIC_URL: https://registry.example.com/s3/astrbot-plugins
  S3_REGION: us-east-1
  S3_AUTO_CREATE_BUCKET: "true"
  S3_CONNECT_TIMEOUT: "3"
  S3_READ_TIMEOUT: "10"
  S3_MAX_ATTEMPTS: "2"
  S3_PLUGINS_PREFIX: plugins
  S3_UNKNOWN_AUTHOR: unknown

  JWT_ALGORITHM: HS256
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  JWT_REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
  LOGIN_RATE_LIMIT_ENABLED: "true"
  LOGIN_RATE_LIMIT_ATTEMPTS: "5"
  LOGIN_RATE_LIMIT_WINDOW_SECONDS: "300"
  LOGIN_RATE_LIMIT_BLOCK_SECONDS: "900"
  BOOTSTRAP_ADMIN_USERNAME: admin
  BOOTSTRAP_ADMIN_ROLE: admin

  VIRUSTOTAL_TIMEOUT_SECONDS: "120"
  VIRUSTOTAL_POLL_INTERVAL_SECONDS: "10"
  VIRUSTOTAL_MAX_POLL_INTERVAL_SECONDS: "320"
  VIRUSTOTAL_MAX_POLL_ATTEMPTS: "24"
  VIRUSTOTAL_MAX_WAIT_SECONDS: "1800"
  VIRUSTOTAL_MAX_DIRECT_UPLOAD_BYTES: "33554432"
  CLAMAV_ENABLED: "false"
  CLAMAV_HOST: "clamav"
  CLAMAV_PORT: "3310"
  CLAMAV_TIMEOUT_SECONDS: "120"
  CLAMAV_STREAM_CHUNK_BYTES: "1048576"
  CLAMAV_MAX_STREAM_BYTES: "104857600"
  LLM_AGENT_ENABLED: "false"
  LLM_AGENT_BASE_URL: ""
  LLM_AGENT_MODEL: ""
  LLM_AGENT_MAX_CONTEXT_CHARS: "200000"
  SCAN_ENABLED_PROVIDERS: "clamav,virustotal,llm_agent"
  SCAN_PASS_WHEN_UNCONFIGURED: "false"
  SCAN_UNCONFIGURED_MESSAGE: Scan not configured
  SCAN_REQUIRE_HUMAN_REVIEW: "true"
  SCAN_AUTO_PUBLISH_ENABLED: "false"

  MAX_UPLOAD_BYTES: "52428800"
  MAX_UNZIP_BYTES: "209715200"
  MAX_ZIP_ENTRIES: "2000"
  MAX_SINGLE_FILE_BYTES: "52428800"
  MAX_RELEASE_ZIP_BYTES: "52428800"
  GIT_CLONE_TIMEOUT: "120"
  GIT_HTTP_PROXY: ""
  BUILD_NETWORK_DISABLED: "true"
  GIT_ALLOWED_HOSTS: github.com
  GIT_TEMP_PREFIX: astrbot-repo-

  WEBHOOK_AUTO_VERSION: auto
  GITHUB_WEBHOOK_REQUIRE_SECRET: "true"
