apiVersion: v1
kind: Secret
metadata:
  name: astrbot-registry-secrets
  namespace: astrbot-registry
  labels:
    app.kubernetes.io/name: astrbot-community-plugin-registry
    app.kubernetes.io/part-of: astrbot-registry
type: Opaque
stringData:
  # PostgreSQL password. Keep DATABASE_URL in sync with this value.
  # PostgreSQL 密码。DATABASE_URL 中的密码必须与它一致。
  PG_PASSWORD: replace-with-postgres-password
  DATABASE_URL: postgresql+asyncpg://astrbot:replace-with-postgres-password@postgres:5432/astrbot_registry

  # SeaweedFS S3 credentials. Keep seaweedfs-s3.json in sync with these values.
  # SeaweedFS S3 凭据。seaweedfs-s3.json 中的凭据必须与它们一致。
  S3_ACCESS_KEY: replace-with-s3-access-key
  S3_SECRET_KEY: replace-with-s3-secret-key
  seaweedfs-s3.json: |
    {
      "signingKey": "replace-with-random-seaweedfs-signing-key",
      "identities": [
        {
          "name": "registry",
          "credentials": [
            {
              "accessKey": "replace-with-s3-access-key",
              "secretKey": "replace-with-s3-secret-key"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        },
        {
          "name": "anonymous",
          "actions": ["Read"]
        }
      ]
    }

  # JWT and bootstrap admin.
  # JWT 与启动管理员账号。
  JWT_SECRET: replace-with-at-least-32-random-characters
  BOOTSTRAP_ADMIN_PASSWORD: replace-with-admin-password

  # Optional providers. Leave empty to disable the provider.
  # 可选 provider。留空表示关闭。
  # Optional GitHub token used by repo inspection and clone when no per-request token is provided.
  # 可选 GitHub Token；未填写单次请求 Token 时，用于仓库检测和 clone，避免匿名 API 限流。
  GITHUB_TOKEN: ""
  VIRUSTOTAL_API_KEY: ""
  LLM_AGENT_API_KEY: ""
  GITHUB_WEBHOOK_SECRET: ""
