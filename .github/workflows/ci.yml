name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    name: Registry backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Lint registry
        run: uv run ruff check registry/src registry/tests

      - name: Test registry
        run: uv run pytest -q

  acprctl:
    name: acprctl
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acprctl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: acprctl/go.mod
          cache-dependency-path: acprctl/go.mod

      - name: Test acprctl
        run: go test ./...

      - name: Build acprctl
        run: go build -trimpath -o acprctl .

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

  deploy:
    name: Deployment templates
    runs-on: ubuntu-latest
    env:
      PG_PASSWORD: test
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      JWT_SECRET: "01234567890123456789012345678901"
      BOOTSTRAP_ADMIN_PASSWORD: test
      DEPLOY_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose.yml
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yml config --quiet

      - name: Validate compose.caddy.yml
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yml -f deploy/compose.caddy.yml config --quiet

      - name: Validate domain Caddyfile
        run: |
          docker run --rm \
            -e PUBLIC_HOST=registry.example.com \
            -e ACME_EMAIL=admin@example.com \
            -v "$PWD/deploy/caddy/Caddyfile.domain.example:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate IP Caddyfile
        run: |
          docker run --rm \
            -e PUBLIC_HOST=203.0.113.10 \
            -e ACME_EMAIL=admin@example.com \
            -v "$PWD/deploy/caddy/Caddyfile.ip.example:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs:
      - registry
      - dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.registry
          target: backend
          push: false

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.registry
          target: worker
          push: false

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: false
