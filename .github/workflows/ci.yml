name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    name: Registry backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Lint registry
        run: uv run ruff check registry/src registry/tests

      - name: Test registry
        run: uv run pytest -q

  acprctl:
    name: acprctl
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acprctl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: acprctl/go.mod
          cache-dependency-path: acprctl/go.mod

      - name: Test acprctl
        run: go test ./...

      - name: Build acprctl
        run: go build -trimpath -o acprctl .

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs:
      - registry
      - dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.registry
          target: backend
          push: false

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.registry
          target: worker
          push: false

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: false
