name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Prepare release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Tag $RELEASE_TAG points to $tag_sha, expected $RELEASE_SHA"
            exit 1
          fi
          repo_name="${GITHUB_REPOSITORY#*/}"
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${repo_name}"
          image_prefix="$(tr '[:upper:]' '[:lower:]' <<<"$image_prefix")"
          short_sha="${RELEASE_SHA::12}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_prefix=$image_prefix" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.registry
          target: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-backend:${{ steps.meta.outputs.release_tag }}
            ${{ steps.meta.outputs.image_prefix }}-backend:sha-${{ steps.meta.outputs.short_sha }}

      - name: Publish worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.registry
          target: worker
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-worker:${{ steps.meta.outputs.release_tag }}
            ${{ steps.meta.outputs.image_prefix }}-worker:sha-${{ steps.meta.outputs.short_sha }}

      - name: Publish dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-dashboard:${{ steps.meta.outputs.release_tag }}
            ${{ steps.meta.outputs.image_prefix }}-dashboard:sha-${{ steps.meta.outputs.short_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: acprctl/go.mod
          cache-dependency-path: acprctl/go.mod

      - name: Build acprctl release artifacts
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          targets=(
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
            windows/arm64
          )
          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="acprctl_${RELEASE_TAG}_${goos}_${goarch}"
            workdir="dist/$name"
            mkdir -p "$workdir"
            binary="acprctl"
            if [[ "$goos" == "windows" ]]; then
              binary="acprctl.exe"
            fi
            (
              cd acprctl
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -trimpath -ldflags="-s -w" -o "../$workdir/$binary" .
            )
            cp acprctl/README.md "$workdir/README.md"
            if [[ "$goos" == "windows" ]]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "$workdir"
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
