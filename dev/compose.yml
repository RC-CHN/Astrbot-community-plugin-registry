# 开发环境一键栈：中间件 + registry 后端 + worker + dashboard 前端
# 只暴露 dashboard 端口，nginx 内部反代 /api 与 /s3
name: ${COMPOSE_PROJECT_NAME:-astrbot-registry-dev}

x-backend-env: &backend-env
  APP_HOST: 0.0.0.0
  APP_PORT: 8000
  APP_RELOAD: "false"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql+asyncpg://${PG_USER:-astrbot}:${PG_PASSWORD:-astrbot_secret}@postgres:5432/${PG_DATABASE:-astrbot_registry}
  DATABASE_AUTO_MIGRATE: "true"
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-adminadmin}
  S3_BUCKET: ${S3_BUCKET:-astrbot-plugins}
  S3_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:${DASHBOARD_PORT:-3001}/s3/${S3_BUCKET:-astrbot-plugins}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_AUTO_CREATE_BUCKET: "true"
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  JWT_ALGORITHM: HS256
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123456}
  BOOTSTRAP_ADMIN_ROLE: admin
  VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
  LLM_AGENT_ENABLED: ${LLM_AGENT_ENABLED:-false}
  LLM_AGENT_BASE_URL: ${LLM_AGENT_BASE_URL:-}
  LLM_AGENT_MODEL: ${LLM_AGENT_MODEL:-}
  LLM_AGENT_API_KEY: ${LLM_AGENT_API_KEY:-}
  SCAN_PASS_WHEN_UNCONFIGURED: ${SCAN_PASS_WHEN_UNCONFIGURED:-true}
  GIT_ALLOWED_HOSTS: ${GIT_ALLOWED_HOSTS:-github.com}
  BUILD_NETWORK_DISABLED: ${BUILD_NETWORK_DISABLED:-true}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-astrbot-registry-dev-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-astrbot_registry}
      POSTGRES_USER: ${PG_USER:-astrbot}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-astrbot_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    mem_limit: ${PG_MEM_LIMIT:-512m}
    cpus: "${PG_CPUS:-1.0}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-astrbot} -d ${PG_DATABASE:-astrbot_registry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-astrbot-registry-dev-redis}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "${REDIS_APPENDONLY:-yes}"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-128mb}"
      - --maxmemory-policy
      - "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    cpus: "${REDIS_CPUS:-0.25}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}
    container_name: ${SEAWEEDFS_CONTAINER_NAME:-astrbot-registry-dev-seaweedfs}
    restart: unless-stopped
    command: server -s3 -s3.iam=false -s3.config=/etc/seaweedfs/s3.json -dir=/data
    environment:
      WEED_S3_CONFIG: /etc/seaweedfs/s3.json
    volumes:
      - s3_data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    mem_limit: ${S3_MEM_LIMIT:-256m}
    cpus: "${S3_CPUS:-0.5}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://$$(hostname -i | awk '{print $$1}'):9333/"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-astrbot-registry-dev-backend}
    build:
      context: ..
      dockerfile: dev/Dockerfile.backend
    container_name: ${BACKEND_CONTAINER_NAME:-astrbot-registry-dev-backend}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment: *backend-env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${BACKEND_MEM_LIMIT:-512m}
    cpus: "${BACKEND_CPUS:-1.0}"

  worker:
    image: ${BACKEND_IMAGE:-astrbot-registry-dev-backend}
    container_name: ${WORKER_CONTAINER_NAME:-astrbot-registry-dev-worker}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment: *backend-env
    command: ["uv", "run", "python", "-m", "astrbot_registry.worker"]
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    cpus: "${WORKER_CPUS:-1.0}"

  dashboard:
    image: ${DASHBOARD_IMAGE:-astrbot-registry-dev-dashboard}
    build:
      context: ..
      dockerfile: dev/Dockerfile.dashboard
    container_name: ${DASHBOARD_CONTAINER_NAME:-astrbot-registry-dev-dashboard}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3001}:80"
    mem_limit: ${DASHBOARD_MEM_LIMIT:-128m}
    cpus: "${DASHBOARD_CPUS:-0.25}"

volumes:
  pg_data:
    name: ${PG_VOLUME_NAME:-astrbot-registry-dev-pg-data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-astrbot-registry-dev-redis-data}
  s3_data:
    name: ${S3_VOLUME_NAME:-astrbot-registry-dev-s3-data}
